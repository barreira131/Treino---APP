function seriesCount(ex){return Array.isArray(ex[4])?ex[4].length:Number(ex[4])||0}
function calcMuscles(){
 const out=MUSCLE_GROUPS.map(g=>({group:g.group,color:g.color,parts:g.parts.map(part=>({part,direct:0,indirect:0,total:0,frequency:0,names:[],contributions:[]})),total:0}));
 const index={}; out.forEach(g=>g.parts.forEach(p=>index[g.group+'|'+p.part]=p));
 for(const [name,maps] of Object.entries(MUSCLE_MAP)){
   let ex=null,day=''; for(const [dn,d] of Object.entries(DAYS)){const found=d.items.find(x=>x[0]===name); if(found){ex=found;day=dn;break;}}
   if(!ex) continue; const sets=seriesCount(ex);
   for(const [group,part,weight,type] of maps){const p=index[group+'|'+part];if(!p)continue;const val=sets*weight;p.total+=val;if(type==='direct')p.direct+=val;else p.indirect+=val;p.frequency++;p.names.push(name);p.contributions.push({name,day,sets,weight,type,val});}
 }
 out.forEach(g=>{g.parts.forEach(p=>{p.frequency=new Set(p.contributions.map(c=>c.name)).size;p.days=[...new Set(p.contributions.map(c=>c.day))];});g.status=statusForGroup(g)}); return out;
}
function bandFor(group,part){
 const bands={
  'Peito':{'Porção superior / clavicular':[6,18],'Porção média / esternal':[8,20],'Porção inferior':[6,16]},
  'Costas':{'Grande dorsal / latíssimo':[8,20],'Romboides / trapézio médio':[6,18],'Trapézio inferior':[4,12]},
  'Ombros':{'Deltoide anterior':[6,16],'Deltoide lateral':[6,14],'Deltoide posterior':[6,16]},
  'Bíceps':{'Bíceps braquial':[6,18],'Braquial':[4,14],'Braquiorradial':[4,12]},
  'Tríceps':{'Cabeça longa':[6,18],'Cabeça lateral':[6,18],'Cabeça medial':[4,16]},
  'Quadríceps':{'Reto femoral':[6,16],'Vasto lateral':[8,18],'Vasto medial / intermédio':[8,18]},
  'Isquiotibiais':{'Bíceps femoral':[6,16],'Semitendinoso':[6,16],'Semimembranoso':[6,16]},
  'Glúteos':{'Glúteo máximo':[6,18],'Glúteo médio':[3,10],'Glúteo mínimo':[2,8]},
  'Gémeos':{'Gastrocnémio':[4,12],'Sóleo':[4,12]},
  'Lombares':{'Eretores da coluna':[2,10]},
  'Antebraço':{'Flexores':[4,12],'Extensores':[4,12],'Pronação / supinação':[2,8]},
  'Core':{'Reto abdominal':[4,12],'Oblíquos / estabilidade':[3,10]},
  'Trapézio':{'Superior':[4,12],'Médio / inferior':[5,14]},
  'Manguito rotador':{'Rotadores externos':[2,8],'Rotadores internos':[2,8]}
 };
 return (bands[group]&&bands[group][part])||[4,14];
}
function statusForPart(n,group,part){const [lo,hi]=bandFor(group,part);if(n<lo)return 'low';if(n>hi)return 'high';return 'good'}
function statusForGroup(g){const active=g.parts.filter(p=>p.total>0);if(!active.length)return 'low';if(active.some(p=>statusForPart(p.total,g.group,p.part)==='high'))return 'high';if(active.some(p=>statusForPart(p.total,g.group,p.part)==='low'))return 'low';return 'good'}
function statusText(s){return s==='low'?'Atenção: abaixo da faixa de trabalho':s==='high'?'Volume elevado: rever eficiência':'Cobertura dentro da faixa de trabalho'}
function miniMuscleCard(m){return `<div class="muscleCard"><div class="muscleHead" style="background:${m.color}"><span>${esc(m.group)}</span><span>${m.parts.filter(p=>statusForPart(p.total,m.group,p.part)==='good').length}/${m.parts.length} na faixa</span></div><div class="muscleBody">${m.parts.map(p=>{const [lo,hi]=bandFor(m.group,p.part);const st=statusForPart(p.total,m.group,p.part);const pct=Math.min(100,Math.max(4,(p.total/hi)*100));const contribs=[...p.contributions].sort((a,b)=>b.val-a.val);const shown=contribs.slice(0,5);const gap=p.total>hi?`Excesso estimado: +${(p.total-hi).toFixed(1)}`:p.total<lo?`Falta estimada: ${(lo-p.total).toFixed(1)}`:'Dentro da faixa';return `<div class="muscleRow"><div class="muscleRowTop"><span>${esc(p.part)}</span><span class="status ${st}">${p.total.toFixed(1)}</span></div><div class="bar"><i style="width:${pct}%;background:${m.color}"></i></div><div class="muted">Diretas: ${p.direct.toFixed(1)} · Indiretas: ${p.indirect.toFixed(1)} · Exercícios: ${p.frequency} · Faixa: ${lo}–${hi}</div><div class="analysisGap ${st}">${gap}</div>${contribs.length?`<details class="contribDetails"><summary>Ver origem do estímulo (${contribs.length})</summary><div class="contribList">${shown.map(c=>`<div class="contribItem"><b>${esc(c.name)}</b><span>${esc(c.day)} · ${c.sets} séries · ${c.type==='direct'?'direta':'indireta'} · ${Math.round(c.weight*100)}% → <strong>${c.val.toFixed(1)}</strong></span></div>`).join('')}${contribs.length>5?`<div class="muted" style="margin-top:7px">+ ${contribs.length-5} outros exercícios</div>`:''}</div></details>`:''}</div>`}).join('')}</div></div>`}

function muscleWeeklyDistribution(rows){
 const map={};
 rows.forEach(g=>g.parts.forEach(p=>{
   const key=g.group+'|'+p.part;
   const days=[...new Set(p.contributions.map(c=>c.day))];
   map[key]={group:g.group,part:p.part,total:p.total,direct:p.direct,indirect:p.indirect,days};
 }));
 return Object.values(map);
}

function frequencyDashboard(rows){
 const parts=rows.flatMap(g=>g.parts.map(p=>({group:g.group,part:p.part,days:p.days||[],total:p.total,direct:p.direct,indirect:p.indirect}))); 
 const two=parts.filter(p=>p.days.length>=2).length, one=parts.filter(p=>p.days.length===1).length, zero=parts.filter(p=>p.days.length===0).length;
 const groups=rows.map(g=>({group:g.group,days:[...new Set(g.parts.flatMap(p=>p.days||[]))]}));

function exerciseAuditPanel(){

function changePlan6Day(d){state.day=d;save();tab='Treino 6×';render()}function clearDay(){if(confirm(tab==='Treino 6×'?'Limpar os registos do Treino ATIVO 6× deste dia?':'Limpar os registos do Registo original deste dia?')){let prefix=tab==='Treino 6×'?'p6-'+state.day+'-':state.day+'-';Object.keys(state.logs).filter(k=>k.startsWith(prefix)).forEach(k=>delete state.logs[k]);save();render()}}
function finishWorkout(){if(tab==='Treino 6×'){let d=PLAN6[state.day];state.history.unshift({date:new Date().toLocaleString('pt-PT'),day:state.day,type:'Treino ATIVO 6×',label:d.label,items:d.items.map((e,i)=>({name:e[0],log:state.logs['p6-'+key(state.day,i)]||{}}))});}else{let d=DAYS[state.day];state.history.unshift({date:new Date().toLocaleString('pt-PT'),day:state.day,type:'Registo original',items:d.items.map((e,i)=>({name:e[0],log:state.logs[key(state.day,i)]||{}}))});}state.history=state.history.slice(0,100);save();alert('Treino guardado no histórico.');render()}
function library(){let q='';return `<section class="panel"><div class="sectionTitle"><div><h2>Biblioteca</h2><div class="muted">Todos os exercícios registados no documento.</div></div></div><input class="search" id="libSearch" placeholder="Pesquisar exercício, músculo ou nome técnico" oninput="filterLibrary(this.value)"><div id="libList" class="libraryGrid">${allExercises().map(x=>`<div class="libraryItem" data-text="${esc((x[0]+' '+x[1]+' '+x[2]).toLowerCase())}"><b>${esc(x[0])}</b><div class="muted">${esc(x[1])}</div><div style="margin-top:5px;font-size:12px">${esc(x[2])}</div></div>`).join('')}</div></section>`}
function filterLibrary(q){let z=q.toLowerCase();document.querySelectorAll('.libraryItem').forEach(x=>x.style.display=x.dataset.text.includes(z)?'block':'none')}
function allExercises(){return Object.values(DAYS).flatMap(d=>d.items)}
function body(){let b=state.body[state.body.length-1]||{};return `<section class="panel"><h2>Corpo</h2><div class="muted">Registo corporal para acompanhar evolução.</div><div class="grid" style="grid-template-columns:repeat(2,1fr)"><div class="field"><label>Peso (kg)</label><input id="bw" value="${esc(b.weight||'')}"></div><div class="field"><label>Cintura (cm)</label><input id="waist" value="${esc(b.waist||'')}"></div><div class="field"><label>Peito (cm)</label><input id="chest" value="${esc(b.chest||'')}"></div><div class="field"><label>Braço (cm)</label><input id="arm" value="${esc(b.arm||'')}"></div></div><button class="primary" onclick="saveBody()">Guardar registo</button></section><section class="panel"><h2>Registos recentes</h2>${state.body.length?state.body.slice(-10).reverse().map(x=>`<div class="historyItem"><b>${esc(x.date)}</b><div class="muted">Peso ${esc(x.weight||'—')} kg · Cintura ${esc(x.waist||'—')} cm · Peito ${esc(x.chest||'—')} cm · Braço ${esc(x.arm||'—')} cm</div></div>`).join(''):'<div class="empty">Ainda não existem registos.</div>'}</section>`}
function saveBody(){state.body.push({date:new Date().toLocaleString('pt-PT'),weight:document.getElementById('bw').value,waist:document.getElementById('waist').value,chest:document.getElementById('chest').value,arm:document.getElementById('arm').value});save();render()}
function history(){return `<section class="panel"><h2>Histórico</h2><div class="muted">Sessões guardadas nesta APP.</div>${state.history.length?state.history.map((x,i)=>`<div class="historyItem"><b>${esc(x.day)} — ${esc(x.date)}</b><div class="muted">${x.items.length} exercícios registados</div></div>`).join(''):'<div class="empty">Ainda não existem treinos guardados.</div>'}</section>`}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();

</script></body></html>
